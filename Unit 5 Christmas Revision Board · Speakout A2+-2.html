<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 5 Quest · Speakout A2+</title>
<style>
:root{--bg:#fff;color-scheme:light;--card:#fff;--tx:#17171c;--mu:#6b6d7a;--pr:#c1272d;--pl:#fdeeee;--cl:#f6c9c9;--ci:#7a1216;--ok:#14a35c;--okb:#d9f6e6;--no:#e5484d;--nob:#fde4e4;--bd:#e3e4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark) and (min-width:99999px){:root:not([data-theme="light"]){--bg:#101116;--card:#1a1b23;--tx:#f1f1f6;--mu:#a0a2b3;--pr:#8ea0ff;--pl:#262a47;--cl:#3a3f72;--ci:#dfe2ff;--ok:#4be09b;--okb:#153a2b;--no:#ff7b80;--nob:#42202a;--bd:#2e3040;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color-scheme:light}body{background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:1100px;margin:0 auto;padding:34px 18px 8px}
.u{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:800;line-height:1.1;display:flex;align-items:center;gap:14px}
.c{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;border-radius:50%;background:var(--cl);color:var(--ci);font-size:.85em}
.ut{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;line-height:1.15;margin:8px 0 4px}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-weight:600;font-size:.9rem}
.hud span{background:var(--cl);color:var(--ci);border-radius:20px;padding:3px 12px}
.pg{max-width:360px;height:8px;background:var(--cl);border-radius:8px;margin-top:12px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--pr);transition:width .4s}
main{max-width:1100px;margin:0 auto;padding:6px 14px 110px}
.lbl{font-size:clamp(1.3rem,4vw,1.8rem);color:var(--mu);font-weight:300;margin:34px 4px 8px}
.frame{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;counter-reset:t;box-shadow:0 1px 3px rgba(20,20,40,.06)}
.hd .u{font-size:1.15rem}.hd .ut{font-size:1.1rem;margin:4px 0}.hd .ls{font-size:1rem;color:var(--mu)}
.hd{align-self:start}
.learn{background:var(--pl);border-radius:4px;padding:14px}
.learn>h3{margin:0 0 8px}
.task h3,.learn>h3{font-size:1rem;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.task h3::before{counter-increment:t;content:counter(t);display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;height:22px;border-radius:50%;background:var(--cl);color:var(--ci);font-size:.75rem}
.task{min-width:0}
.tip{background:var(--card);border-radius:4px;padding:9px 11px;margin:10px 0 0;font-size:.92rem;border:1px solid var(--cl)}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--card)}td,th{border:1px solid var(--cl);padding:5px 8px;text-align:left}th{background:var(--cl);color:var(--ci)}
.fls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px}
.fl{min-height:56px;border-radius:4px;background:var(--card);border:1px solid var(--cl);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;cursor:pointer;font-size:.85rem;user-select:none}
.fl b{color:var(--pr)}.fl i{display:none;font-style:normal}.fl.on{background:var(--pr);color:#fff}.fl.on b{display:none}.fl.on i{display:block}
.it{padding:8px 0;border-top:1px solid var(--bd)}.it:first-of-type{border-top:0}.it p{margin:0 0 6px}
.opts,.bank,.line{display:flex;flex-wrap:wrap;gap:6px}
.opt,.chip,.btn{border:1px solid var(--cl);background:var(--pl);color:var(--tx);border-radius:4px;padding:5px 12px;font:inherit;font-size:.93rem;cursor:pointer}
.opt:active,.chip:active{transform:scale(.96)}
.opt.ok,.chip.ok{border-color:var(--ok);background:var(--okb)}.opt.no,.chip.no{border-color:var(--no);background:var(--nob)}
.btn{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}.btn.alt{background:var(--cl);color:var(--ci);border-color:var(--cl)}
.line{min-height:42px;border-bottom:2px solid var(--cl);margin:6px 0 10px;padding:3px 0}
.chip.u{background:var(--cl)}
input[type=text],textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--cl);border-radius:4px;padding:5px 10px;width:150px}
input.ok{border-color:var(--ok);background:var(--okb)}input.no{border-color:var(--no);background:var(--nob)}
textarea{width:100%;min-height:130px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mt .opt{width:100%;text-align:left}.mt .opt.sel{border-color:var(--pr);background:var(--cl)}.mt .opt.done{visibility:hidden}
.sc{text-align:center}.sc .w{font-size:1.8rem;font-weight:800;margin:8px 0}.sc .opts{justify-content:center}
.big{font-size:1.05rem;text-align:center;padding:12px;background:var(--pl);border-radius:4px;margin:6px 0}.big b{display:block;font-size:1.25rem;color:var(--pr)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:6px;max-width:96vw;overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:40px;padding:6px;box-shadow:0 6px 24px rgba(20,20,60,.18)}
#nav button{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--tx);border-radius:30px;padding:4px 12px 4px 5px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
#nav button b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--cl);align-items:center;justify-content:center;font-weight:400}
#nav button.dn b{background:var(--okb);box-shadow:0 0 0 2px var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:24px;font-weight:700;transition:.25s;z-index:10;pointer-events:none}
#toast.s{opacity:1;transform:translate(-50%,0)}
.bd{display:inline-block;font-size:2.2rem;margin:4px}
@media(prefers-color-scheme:dark) and (min-width:99999px){}.frame{border-top:6px solid var(--pr)}.lbl::before{content:'';display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--pr);margin-right:.5em;vertical-align:middle}.lbl{color:var(--ci);font-weight:400}.task{border-left:4px solid var(--cl);padding-left:12px}.task.sc{border-left:0;padding-left:0}.learn{border:1px solid var(--cl)}.tag{background:var(--pr)}.frame .btn{background:var(--pr);border-color:var(--pr)}.opt:hover,.chip:hover{border-color:var(--pr)}.p0{--pr:#c1272d;--pl:#fdeeee;--cl:#f6c9c9;--ci:#7a1216}.p1{--pr:#1b7a43;--pl:#e8f5ec;--cl:#bfe3cb;--ci:#0d4527}.p2{--pr:#b8860b;--pl:#fff6da;--cl:#f2dd9a;--ci:#6b4c00}
body::before{content:"";display:block;height:10px;background:repeating-linear-gradient(135deg,#c1272d 0 14px,#fff 14px 28px,#1b7a43 28px 42px,#fff 42px 56px)}
.lbl::before{content:'❄';width:auto;height:auto;background:none;color:var(--pr);border-radius:0;margin-right:.4em}
.ph{width:100%;max-height:380px;object-fit:cover;border-radius:4px;display:block;margin-bottom:8px}
.fls.w{grid-template-columns:1fr}.fls.w .fl{justify-content:flex-start;text-align:left;padding:8px 12px}
.hud span{cursor:default}#mu{cursor:pointer}.intro{color:var(--mu);font-size:.9rem;margin:0 0 8px}</style></head><body>
